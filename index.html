<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broad Peak Adventures</title>
    <!-- Preload Hero Image for instant FCP / LCP -->
    <link rel="preload" as="image" href="/assets/images/k2.webp" type="image/webp" fetchpriority="high" />

    <!-- DNS Prefetch & Preconnect for CDNs -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Remix Icons (Non-render-blocking async load) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"></noscript>

    <!-- Google Fonts (Non-render-blocking async load with display=swap) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root"></div>

    <!-- Main React Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Lightweight UI scripts -->
    <script src="/js/main.js" defer></script>
    <script src="/js/animations.js" defer></script>
  </body>
</html>
